<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socials overlay - TikTok optimized</title>

<style>
  :root {
    --kick: #53fc18;
    --bg: #0b0e0f;
    --text: #ffffff;
    --margin-left: 32px;
    --margin-bottom: 32px;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  /*
    PERFORMANCE NOTES
    - Animated properties are only transform + opacity.
    - No animated box-shadow/filter/blur.
    - No layout properties are animated.
    - The glow is a lightweight opacity-only overlay.
  */

  .wrap {
    position: fixed;
    left: var(--margin-left);
    bottom: var(--margin-bottom);

    transform: translate3d(calc(-100% - var(--margin-left) - 40px), 0, 0);
    opacity: 0;

    /* Keep one composited layer for the moving element. */
    will-change: transform, opacity;

    /* CSS zoom is cheaper here than animating layout dimensions. */
    zoom: 1;
  }

  .wrap.in {
    animation: slide-in 700ms cubic-bezier(.2,.9,.25,1) both;
  }

  .wrap.out {
    animation: slide-out 550ms cubic-bezier(.6,0,.8,.3) both;
  }

  @keyframes slide-in {
    from {
      transform: translate3d(calc(-100% - var(--margin-left) - 40px), 0, 0);
      opacity: 0;
    }
    to {
      transform: translate3d(0, 0, 0);
      opacity: 1;
    }
  }

  @keyframes slide-out {
    from {
      transform: translate3d(0, 0, 0);
      opacity: 1;
    }
    to {
      transform: translate3d(calc(-100% - var(--margin-left) - 40px), 0, 0);
      opacity: 0;
    }
  }

  .stage {
    position: relative;
    transform-origin: left center;
    will-change: transform;

    /*
      Lightweight pulse:
      no box-shadow animation.
      The ring is already rendered and only its opacity changes.
    */
    --pulse: rgba(255,255,255,.55);
  }

  .stage.pulse {
    animation: pulse 600ms ease-in-out both;
  }

  @keyframes pulse {
    0%   { transform: scale3d(1,1,1); }
    45%  { transform: scale3d(1.06,1.06,1); }
    100% { transform: scale3d(1,1,1); }
  }

  /*
    Instead of animated blurred box-shadow, use a simple translucent
    outline. It gives a pulse without triggering expensive blur repaints.
  */
  .glow {
    position: absolute;
    inset: -2px;
    border: 2px solid var(--pulse);
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    box-sizing: border-box;
    will-change: opacity;
  }

  .stage.pulse .glow {
    animation: glow 600ms ease-in-out both;
  }

  @keyframes glow {
    0%   { opacity: 0; }
    45%  { opacity: .9; }
    100% { opacity: 0; }
  }

  .pill {
    position: relative;
    display: flex;
    align-items: stretch;
    height: 52px;

    background: var(--bg);
    border-radius: 10px;
    overflow: hidden;

    /*
      One small static shadow only.
      It is never animated.
    */
    box-shadow: 0 4px 12px rgba(0,0,0,.35);

    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    contain: layout paint;
  }

  .stage[data-icon="kick"] { --pulse: rgba(83,252,24,.8); }
  .stage[data-icon="yt"]   { --pulse: rgba(255,0,0,.8); }
  .stage[data-icon="tt"]   { --pulse: rgba(255,255,255,.75); }
  .stage[data-icon="ig"]   { --pulse: rgba(214,41,118,.8); }

  .mark {
    width: 52px;
    min-width: 52px;
    display: grid;
    place-items: center;
  }

  .mark svg {
    display: none;
    height: 30px;
    width: auto;
  }

  .mark svg.kick {
    fill: var(--kick);
    margin-left: 6px;
  }

  .stage[data-icon="kick"] .mark svg.kick { display: block; }
  .stage[data-icon="ig"]   .mark svg.ig   { display: block; }
  .stage[data-icon="yt"]   .mark svg.yt   { display: block; height: 32px; }
  .stage[data-icon="tt"]   .mark svg.tt   { display: block; }

  .name {
    display: flex;
    align-items: center;
    padding: 0 22px 0 16px;

    color: var(--text);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .2px;
    white-space: nowrap;
  }

  /*
    The overlay can be scaled through the URL:
    ?scale=1.2
  */
  .wrap.scaled {
    transform: translate3d(calc(-100% - var(--margin-left) - 40px), 0, 0)
               scale(var(--scale));
    transform-origin: left bottom;
  }

  .wrap.scaled.in {
    animation-name: slide-in-scaled;
  }

  .wrap.scaled.out {
    animation-name: slide-out-scaled;
  }

  @keyframes slide-in-scaled {
    from {
      transform: translate3d(calc(-100% - var(--margin-left) - 40px), 0, 0)
                 scale(var(--scale));
      opacity: 0;
    }
    to {
      transform: translate3d(0, 0, 0) scale(var(--scale));
      opacity: 1;
    }
  }

  @keyframes slide-out-scaled {
    from {
      transform: translate3d(0, 0, 0) scale(var(--scale));
      opacity: 1;
    }
    to {
      transform: translate3d(calc(-100% - var(--margin-left) - 40px), 0, 0)
                 scale(var(--scale));
      opacity: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .wrap.in,
    .wrap.out,
    .stage.pulse,
    .stage.pulse .glow {
      animation-duration: 1ms;
    }
  }
</style>
</head>

<body>

<div class="wrap" id="wrap">
  <div class="stage" id="stage" data-icon="kick">

    <div class="glow"></div>

    <div class="pill">

      </div>

      <div class="name" id="name"></div>
    </div>
  </div>
</div>

<script>
  /*
    DEFAULTS
    URL parameters still work:
    ?kick=kick.com/nick&ig=@nick&hold=2&gap=0&scale=1.2
  */

  const CONFIG = {
    kick: "kick.com/lotnikv2",
    ig:   "@lotnikv2",
    yt:   "@lotnikkv2",
    tt:   "@lotnikv2",
    hold: 5.2,
    gap: 0,
    scale: 1
  };

  const params = new URLSearchParams(location.search);

  const getNumber = (key, fallback) => {
    const value = parseFloat(params.get(key));
    return Number.isFinite(value) ? value : fallback;
  };

  const hold  = getNumber("hold", CONFIG.hold);
  const gap   = getNumber("gap", CONFIG.gap);
  const scale = getNumber("scale", CONFIG.scale);

  const items = [
    { icon: "kick", text: params.get("kick") || CONFIG.kick },
    { icon: "ig",   text: params.get("ig")   || CONFIG.ig },
    { icon: "yt",   text: params.get("yt")   || CONFIG.yt },
    { icon: "tt",   text: params.get("tt")   || CONFIG.tt }
  ];

  const wrap = document.getElementById("wrap");
  const stage = document.getElementById("stage");
  const nameEl = document.getElementById("name");

  /*
    Scale is part of the same transform as the slide animation.
    This avoids a second transform property fighting with the animation.
  */
  wrap.classList.add("scaled");
  wrap.style.setProperty("--scale", scale);

  const SLIDE_IN  = 700;
  const PULSE     = 600;
  const SLIDE_OUT = 550;

  let index = 0;
  let timer1 = 0;
  let timer2 = 0;

  function restartPulse() {
    stage.classList.remove("pulse");

    /*
      Restart the CSS animation without forcing a full layout read.
      requestAnimationFrame gives the browser a clean frame boundary.
    */
    requestAnimationFrame(() => {
      stage.classList.add("pulse");
    });
  }

  function slideIn() {
    const item = items[index];

    stage.dataset.icon = item.icon;
    nameEl.textContent = item.text;

    wrap.classList.remove("out");
    wrap.classList.add("in");

    timer1 = setTimeout(() => {
      restartPulse();
    }, SLIDE_IN);

    timer2 = setTimeout(() => {
      slideOut();
    }, SLIDE_IN + PULSE + (hold * 1000));
  }

  function slideOut() {
    clearTimeout(timer1);
    clearTimeout(timer2);

    stage.classList.remove("pulse");

    wrap.classList.remove("in");
    wrap.classList.add("out");

    index = (index + 1) % items.length;

    setTimeout(slideIn, SLIDE_OUT + (gap * 1000));
  }

  /*
    Start after a short delay so the browser finishes loading
    before the first animation begins.
  */
  setTimeout(slideIn, 800);
</script>

</body>
</html>
